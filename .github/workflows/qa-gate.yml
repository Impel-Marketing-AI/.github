name: QA Gate

on:
  workflow_call:

permissions:
  pull-requests: write    

jobs:
  qa-gate:
    name: QA Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check QA Gate
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const prAuthor = pr.user.login;
            const sender = context.payload.sender.login;
            const action = context.payload.action;

            // Skip QA Gate for draft PRs
            if (pr.draft) {
              core.info('QA Gate skipped: PR is still in draft.');
              return;
            }

            // If the PR author applied the qa: tested label themselves, remove it and fail
            if (action === 'labeled' && context.payload.label?.name === 'qa: tested' && sender === prAuthor) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                name: 'qa: tested'
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: 'The `qa: tested` label was removed because the PR author cannot mark their own work as tested. Another team member must apply this label after verifying the changes.'
              });

              core.setFailed('QA Gate failed: The PR author cannot apply the `qa: tested` label to their own PR.');
              return;
            }

            // If a non-author applied the qa: tested label, pass immediately
            if (action === 'labeled' && context.payload.label?.name === 'qa: tested') {
              core.info('QA Gate passed: The `qa: tested` label was applied by a team member other than the PR author.');
              return;
            }

            // For label events other than qa: tested (e.g. autolabeler), wait briefly
            // to allow any concurrent label-removal workflow runs to settle
            if (action === 'labeled' || action === 'unlabeled') {
              await new Promise(resolve => setTimeout(resolve, 5000));
            }

            // Fetch current labels from the API instead of the event payload snapshot
            // to avoid race conditions with concurrent workflow runs
            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });
            const hasQaTested = currentLabels.some(l => l.name === 'qa: tested');

            if (!hasQaTested) {
              core.setFailed('QA Gate failed: The `qa: tested` label is not present on this PR. A team member (other than the PR author) must apply this label after verifying the changes.');
              return;
            }

            core.info('QA Gate passed: The `qa: tested` label is present and was applied by a team member other than the PR author.');
