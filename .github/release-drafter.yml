name-template: 'v$RESOLVED_VERSION 🌈'
tag-template: 'v$RESOLVED_VERSION'

sort-direction: ascending

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bug'
  - title: '📦 Dependencies'
    labels:
      - 'dependencies'
  - title: '🧰 Maintenance'
    label: 'chore'

autolabeler:
  - label: 'feature'
    branch:
      - '/^feat\/.+/'
      - '/^feature\/.+/'
  - label: 'fix'
    branch:
      - '/^fix\/.+/'
      - '/^bug\/.+/'
  - label: 'chore'
    branch:
      - '/^chore\/.+/'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
template: |
  ## Changes

  $CHANGES
